name: storyscribe-ai

networks:
  storyscribe-ai-network:
    driver: bridge

volumes:
  ollama:
    driver: local
  shared:
    driver: local

services:
  redis:
    container_name: redis-service
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - storyscribe-ai-network
    restart: unless-stopped
  database:
    container_name: database-service
    build:
      context: .
      dockerfile: builds/database/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    networks:
      - storyscribe-ai-network
    depends_on:
      - redis
  ollama:
    container_name: ollama-service
    build:
      context: .
      dockerfile: builds/ollama/Dockerfile
    ports:
      - '8000:11434'
    networks:
      - storyscribe-ai-network
    depends_on:
      - database
    volumes:
      - ollama:/tmp/models
  whisper:
    container_name: whisper-service
    build:
      context: .
      dockerfile: builds/whisper/Dockerfile
    ports:
      - '8001:3000'
    networks:
      - storyscribe-ai-network
    depends_on:
      - database
    volumes:
      - shared:/usr/workspace/storyscribe-ai/shared
  pdf:
    container_name: pdf-service
    image: spawnia/md-to-pdf:latest
    ports:
      - '8002:8000'
    networks:
      - storyscribe-ai-network
    depends_on:
      - database
  backend:
    container_name: backend-service
    build:
      context: .
      additional_contexts:
        - dist=../../../dist/server
      dockerfile: builds/backend/Dockerfile
    ports:
      - '8003:3000'
    networks:
      - storyscribe-ai-network
    depends_on:
      - ollama
      - whisper
      - pdf
      - database
    volumes:
      - shared:/usr/workspace/storyscribe-ai/shared
